# Sortiva — signals.config.yaml
#
# Every number that decides whether an opportunity is detected, admitted, scored
# or published lives in this one file. Nothing else in the codebase may compare a
# volume, position, impression count or CTR against a literal — a lint rule
# enforces that — so this is the only place any of it can be changed.
#
# `rules_version` is the sha256 of this file's bytes, stamped onto every
# opportunity and gate decision. Editing anything here, comments included,
# changes it, and that is deliberate: it makes "which rules produced this
# result" answerable after the fact, and the weekly review breaks its numbers
# down by that version. Loosen values only against evidence from a version that
# has already run.
#
# Values marked UNSIGNED are starting heuristics nobody has calibrated. They are
# recorded in DECISIONS.md and need the founder's sign-off before they can be
# treated as settled.
#
# Layering: global defaults -> per-locale -> (later) per-store / per-market /
# per-query-type / per-page-type. V1 ships global + per-locale.

version: 1

defaults:
  # ── Signal detection ───────────────────────────────────────────────────────
  # Each signal is one reason to believe there is work worth doing on a page or
  # a keyword cluster. `priority` P0 means V1 detects it; P1 means the data
  # model accommodates it but no detector runs yet. `needs_gsc` marks the ones
  # that cannot fire at all without Search Console, and so go quiet for an
  # account in Limited Intelligence.
  signals:
    striking_distance:
      priority: P0
      needs_gsc: true
      # A page already ranking just off page one, where a push is cheap. Widen
      # the band and you pick up pages too far back to move with an edit;
      # narrow it and you miss easy wins. The window is how much history has to
      # agree before we believe the position.
      position_min: 4
      position_max: 15
      window_days: 28
      # UNSIGNED. How much traffic a page must already carry before a ranking
      # just off page one is worth acting on, as a multiple of what a typical
      # page of *this* store is shown for in the window. At 1 the page has to
      # be at least median. Raise it and only the store's busiest pages
      # qualify; drop it below 1 and pages almost nobody sees start producing
      # work for the merchant.
      impressions_store_median_multiple_min: 1

    low_ctr_at_strong_rank:
      priority: P0
      needs_gsc: true
      # Ranks well, nobody clicks — so the title or description is the problem,
      # not the ranking. The CTR ratio is measured against the store's own
      # fitted click curve, never an absolute rate, so a niche with naturally
      # low CTR is not flagged wholesale. The impressions multiple keeps
      # low-traffic queries out, where a handful of clicks is noise: raise it
      # and only high-traffic pages qualify.
      position_max: 5
      window_days: 28
      impressions_store_median_multiple_min: 2
      observed_vs_predicted_ctr_ratio_max: 0.6

    content_decay:
      priority: P0
      needs_gsc: true
      # A page that used to work and no longer does, judged against itself 12
      # weeks earlier rather than against any absolute number. Requiring the
      # decline to hold across consecutive weekly runs is what stops one bad
      # week — a holiday, an outage, a SERP experiment — being read as decay.
      # Drop that to 1 and the signal gets noisy fast.
      window_days: 28
      comparison_window_offset_weeks: 12
      clicks_ratio_max: 0.6
      position_worsened_min: 3
      consecutive_weekly_evaluations_min: 2
      # UNSIGNED. How well the page had to be doing before the decline counts,
      # as a multiple of the clicks a typical page of this store earned in the
      # same earlier window. At 1 the page has to have been at least median.
      # It is what stops us "recovering" pages that never worked.
      baseline_clicks_store_median_multiple_min: 1

    cannibalization:
      priority: P0
      needs_gsc: true
      # Two of the store's own pages splitting the same query between them.
      # The impression share is what separates real competition from a page
      # that merely brushes the cluster; lower it and ordinary long-tail
      # overlap starts looking like a problem.
      window_days: 28
      competing_urls_min: 2
      impression_share_min: 0.20
      position_max: 30
      # Two pages sharing a search is only a problem once it is shown to be
      # costing something. Either the page Google leads with keeps changing —
      # a sign it cannot decide which of ours to trust — or the search is
      # earning the store fewer clicks than it did before.
      #
      # UNSIGNED. How many times the leading page has to change across the
      # weeks of the window. At 1 a single flip counts.
      leader_changes_min: 1
      # UNSIGNED. How far back the "before" comparison reaches. Same 12 weeks
      # the decay signal uses, kept separate so the two can be tuned apart.
      baseline_offset_weeks: 12
      # UNSIGNED. What counts as the search having lost ground: this window's
      # clicks as a fraction of the same window twelve weeks earlier. At 1.0
      # any decline at all counts, which is the spec read literally — it names
      # a loss and no size. Lower it to demand a real drop rather than drift.
      aggregate_loss_clicks_ratio_max: 1.0

    uncovered_commercial_query:
      priority: P0
      needs_gsc: false
      # Demand exists, the store sells into it, and nothing covers it. The
      # volume floor is gates.demand_floor; this number is how many product
      # families the query has to map to before we will write about it. At 1,
      # a query needs one family that clears the substance floor.
      mapped_families_min: 1

    existing_page_intent_gap:
      priority: P0
      needs_gsc: false
      # A page that ranks but answers less than the pages above it. Subtopics
      # count only if they show up on enough of the top results — one
      # competitor doing something unusual is not a gap. Raising
      # `subtopic_present_on_top_pages_min` demands stronger consensus before
      # we call something missing.
      position_min: 4
      position_max: 20
      missing_subtopics_min: 2
      subtopic_present_on_top_pages_min: 3
      serp_top_n: 5

    competitor_coverage_gap:
      priority: P0
      needs_gsc: false
      # Competitors rank for something we sell and we do not. Requiring two of
      # them keeps one competitor's quirk from setting our roadmap.
      competitors_ranking_min: 2
      competitor_position_max: 10
      our_absent_position_max: 20
      # Where our own relevant page already sits in this band, the answer is to
      # improve it rather than write a second one competing with it.
      optimize_position_min: 11
      optimize_position_max: 30

    product_family_coverage_gap:
      priority: P0
      needs_gsc: false
      # A family that earns real money with nothing written about it. The
      # revenue share is the "matters to this business" test: raise it and only
      # the store's biggest lines qualify.
      revenue_share_min: 0.10
      revenue_window_days: 90
      keyword_candidates_min: 1

    catalog_richness_gap:
      priority: P0
      needs_gsc: false
      # Fires when a candidate clears demand and winnability but the families
      # behind it fail gates.substance_floor — there is an audience and nothing
      # honest to say yet. Produces a task for the merchant, not an article.

    missing_or_weak_metadata:
      priority: P0
      needs_gsc: false

    product_change_impact:
      # Detected by the drift/repair loop rather than here; its thresholds are
      # owned by that card (DECISIONS 2026-08-27 T0.2).
      priority: P0
      needs_gsc: false

    broken_product_reference:
      priority: P0
      needs_gsc: false

    # P1 — the model accommodates these; V1 does not detect them.
    internal_linking_gap:
      priority: P1
      needs_gsc: false
    orphan_page:
      priority: P1
      needs_gsc: false
    indexing_issue:
      priority: P1
      needs_gsc: true
    wrong_canonical_or_duplicate:
      priority: P1
      needs_gsc: true
    content_overlap:
      priority: P1
      needs_gsc: false
    freshness_opportunity:
      priority: P1
      needs_gsc: true
      # Old, flat, and the results around it have moved on. The SERP difference
      # is the one that carries the argument: if the top five are still the
      # same pages, age alone is not a reason to rewrite.
      age_months_min: 12
      stagnation_window_weeks: 12
      serp_set_difference_min: 0.40

  # ── Scoring: turning detected signals into a ranked queue ──────────────────
  scoring:
    create:
      # Applied when the reason to write is a competitor already ranking —
      # evidence someone else has proved the demand. Raise it and competitor
      # gaps crowd out everything else in the queue.
      competitor_gap_source_bonus: 1.15
      # A family's share of trailing-90-day revenue, rescaled into this range,
      # so work on what the store actually sells outranks work on what it
      # merely stocks. Widening the range makes revenue dominate the ordering;
      # collapsing it to 1.0–1.0 turns business weight off entirely.
      business_weight_min: 1.0
      business_weight_max: 1.5

    existing_page:
      # Expected gain for a page that already ranks is modelled as its
      # impressions over this window times the CTR it would gain by moving.
      window_days: 28
      # Where we assume a striking-distance page lands if the work succeeds.
      # Set it to 1 and every such opportunity looks enormous; the number is a
      # deliberately modest claim.
      striking_distance_target_position: 3

    impact:
      # Impact is a percentile rank within the candidate's own action family
      # across this store's current candidate set — never a cross-store or
      # absolute number — and the bands are terciles of it. Move the tercile
      # cut-points and the same candidate changes badge without any change in
      # the underlying work.
      score_min: 0
      score_max: 100
      band_tercile_low_max_percentile: 33.3
      band_tercile_medium_max_percentile: 66.7

    confidence:
      # Confidence is additive and deterministic: how much we trust the
      # evidence, kept separate from how much the work is worth. These points
      # are the whole of it, so changing one re-ranks every candidate that
      # earns it.
      points:
        gsc_evidence_present: 30
        evidence_window_at_least_28_days: 20
        evidence_window_at_least_84_days: 10
        independent_sources_agree: 15
        substance_floor_margin: 15
        no_open_precondition: 10
        validated_across_consecutive_scans: 10
        # The penalty an account without Search Console carries. It is what
        # keeps a guess from presenting itself with the same confidence as a
        # measurement; shrinking it hides that difference from the merchant.
        limited_intelligence_penalty: -20
      # How many separate sources have to say the same thing to count as
      # agreement.
      independent_sources_min: 2
      # Two tiers of "how much history is behind this": the second is additive
      # on top of the first.
      evidence_window_days_tier_1: 28
      evidence_window_days_tier_2: 84
      # How many consecutive weekly scans must have seen the signal before it
      # counts as validated rather than as one week's reading.
      consecutive_scans_min: 2
      clamp_min: 0
      clamp_max: 100
      # Where the score turns into the word the merchant reads. These bands are
      # presentation, not gating: lowering `band_high_min` makes weaker
      # evidence read as "high confidence" without changing what we do with it.
      band_high_min: 70
      band_medium_min: 40

  # ── Gate 1: which topics are allowed in at all ─────────────────────────────
  gates:
    demand_floor:
      # The minimum monthly search volume a keyword needs before we will spend
      # an article on it. Deliberately per-locale, because 50 searches a month
      # in Danish is not 50 in English; the `locales` block below scales this
      # down for smaller markets.
      # UNSIGNED — per-locale floors are required, no table was supplied. This
      # global default is the English-scale floor. See DECISIONS 2026-08-27 T0.2.
      monthly_search_volume_min: 100
      # A merchant who pins a topic has overridden our judgment on purpose, so
      # a zero-volume reading does not veto them. Set false and pinning stops
      # working for anything we have no volume data on.
      allow_zero_volume_when_pinned: true

    winnability:
      # Can this site realistically rank for this, given its authority?
      # Without Search Console we cannot measure authority, so we substitute
      # one pessimistic constant rather than guess per keyword — the effect is
      # that a Limited Intelligence account only gets the easy wins. Raising it
      # would let us make confident claims on evidence we do not have.
      # UNSIGNED — "conservative" was specified, not a number. 0–1 scale.
      limited_intelligence_constant: 0.25
      minimum: 0.15

    substance_floor:
      # Do we know enough about the products to write something worth reading?
      # These count distilled facts, not words: how many distinct facts across
      # the mapped families, how well populated each contributing product is,
      # and how many products have to contribute. Lower them and the pipeline
      # starts producing articles padded out of thin catalog data — which is
      # the failure this gate exists to prevent.
      # UNSIGNED — richness is defined, no floor was stated.
      distinct_facts_min: 8
      populated_fields_per_product_min: 4
      contributing_products_min: 3
      # Clearing the floor by this multiple earns a confidence point: "we have
      # plenty to say", not merely "just enough".
      margin_multiple: 1.5

    existing_target_check:
      # Before creating anything, we look for a page we already have that
      # ranks for the cluster; a match converts the work to OPTIMIZE or REFRESH
      # instead of publishing a second page to compete with the first. This
      # position is the line between "we already rank here" and "we do not":
      # raise it and weak, barely-ranking pages start blocking new articles;
      # lower it and we publish competitors to our own pages.
      window_days: 28
      match_position_max: 30

    # ── Gate 3: draft grading ─────────────────────────────────────────────
    draft_grading:
      # The judge scores each draft on several criteria on this scale, and we
      # gate on the *minimum* score, never the average — so one badly failed
      # criterion cannot be carried by strong ones elsewhere.
      criterion_score_min: 1
      criterion_score_max: 5
      # Information gain and factual grounding are held one point higher than
      # everything else: an article that says nothing new, or says it without
      # support, is the failure mode that costs the merchant trust. Dropping
      # these to 3 is what "loosening the quality bar" would actually mean.
      information_gain_min: 4
      factual_grounding_min: 4
      other_criteria_min: 3
      # One attempt to repair a failed draft, then we stop. More loops mean
      # paying repeatedly to talk a bad draft into passing its own grader.
      repair_loops_max: 1

  # ── Learning: measuring what happened after publish ────────────────────────
  learning:
    # When the calendar's planned horizon falls below this many days, top it
    # up. Shorten it and replenishment runs closer to the edge; lengthen it and
    # we commit to topics further ahead of the evidence.
    replenishment_horizon_days: 60

    labels:
      # Nothing is judged before this many days post-publish — rankings have
      # not settled and an early verdict would teach the pattern learner the
      # wrong lesson.
      maturity_days: 28
      window_days: 28
      # What counts as a winner, always relative to this store's own median
      # rather than an absolute click count, so a small store can have winners.
      winner_clicks_store_median_multiple_min: 2
      winner_position_improvement_min: 5
      # What counts as an underperformer. The age requirement is longer than
      # the maturity gate on purpose: calling something a failure is a heavier
      # claim than calling it a success, and it feeds the multipliers below.
      underperformer_clicks_store_median_multiple_max: 0.25
      underperformer_position_min: 30
      underperformer_age_days_min: 90

    patterns:
      # A pattern is "this kind of article works for this store". It only
      # starts influencing anything once this many rated articles support it —
      # the guard against learning a rule from a single lucky post.
      activation_min_rated: 3
      # And only once that share of them point the same way.
      dominance_share_min: 0.6667
      winner_dominant_multiplier: 1.25
      underperformer_dominant_multiplier: 0.8
      mixed_multiplier: 1.0
      # A hard ceiling and floor on the combined effect, so stacked patterns
      # can never swamp the underlying opportunity score. Widen this and
      # learning starts overriding evidence rather than tilting it.
      multiplier_clamp_min: 0.5
      multiplier_clamp_max: 2.0
      # Only labels from this recent a window feed the patterns, so a store
      # that has changed keeps learning from what it is now.
      recency_window_days: 90
      # How many pattern multipliers one candidate may accumulate.
      max_stacked_multipliers: 3
      # The axes a pattern can be about.
      dimensions:
        - intent_class
        - family_id
        - keyword_cluster
        - action_type

    refresh:
      # Which published pages come back round as refresh candidates: ranking
      # well enough to be worth saving, not so well that there is nothing to
      # gain.
      position_min: 5
      position_max: 15
      window_days: 28
      # A page cannot be refreshed again inside this window, so we do not churn
      # the same article instead of covering new ground.
      cooldown_days: 60
      # And refreshes may not fill more than this share of any replenishment
      # batch — the guard against a calendar that only ever revisits old work.
      batch_share_max: 0.40

    exploration:
      # Every batch reserves slots for topics the scoring did not pick, so the
      # learning loop keeps seeing things outside what it already believes.
      # Whichever of these two is larger wins. Set both to zero and the system
      # can only ever confirm itself.
      reserved_slots_min: 2
      reserved_share_min: 0.15

    outcomes:
      # Whether a specific action worked, measured on the same maturity rule as
      # the labels above.
      maturity_days: 28
      window_days: 28
      optimize:
        # An OPTIMIZE counts as improved on either position or CTR.
        improved_position_delta_min: 2
        improved_ctr_relative_delta_min: 0.20
        # ...but not if impressions collapsed underneath it, which is how a
        # page can post a better CTR while doing worse.
        # UNSIGNED — "impressions not collapsed" was stated without a number.
        impressions_not_collapsed_ratio_min: 0.5
      refresh:
        # A REFRESH counts as recovered when clicks come back to this share of
        # the pre-decay baseline. It is deliberately below 1.0: full recovery
        # is rare and demanding it would record every refresh as a failure.
        recovered_clicks_baseline_ratio_min: 0.8
      fix:
        # A FIX counts as working when the cluster's impressions concentrate on
        # the URL we designated primary.
        primary_url_impression_share_min: 0.70

  # ── Caps, kill switches and auto-trips ─────────────────────────────────────
  # These are the money and blast-radius limits. Every one of them is enforced
  # from our own database counters at job dequeue; analytics never gates
  # anything.
  budgets:
    optimize:
      # How many OPTIMIZE generations one account may trigger in a day.
      generations_per_account_per_day: 2
    intent_gap:
      # How many intent-gap analyses one account may trigger in a day. Each is
      # a paid SERP read plus an LLM call, so this is a per-account spend
      # ceiling wearing a feature's name. UNSIGNED — no number was stated.
      analyses_per_account_per_day: 10

  auto_trips:
    # How stale a kill-switch reading may be when a job checks it. This is the
    # worst case between flipping a switch and work actually stopping.
    flag_check_max_staleness_seconds: 60

    account_llm_spend:
      # One account spending far more than it normally does is either a bug or
      # abuse; either way we pause that account's generation rather than find
      # out from the bill. The multiple catches the anomaly, the hard cap
      # catches the case where the median was already high.
      trailing_median_multiple_max: 10
      trailing_median_window_days: 30
      # UNSIGNED — a hard dollar cap was required with no number. At $89/mo
      # (about $2.90/day of revenue) this is a loud-failure ceiling, not a
      # budget: it should never be reached in normal operation.
      hard_cap_usd_per_day: 5.00

    dataforseo_spend:
      # Total daily SEO-data spend across all accounts; tripping it pauses
      # enrichment everywhere rather than for one account, because the vendor
      # bill is global. UNSIGNED.
      global_cap_usd_per_day: 50.00

    preview_spend:
      # The logged-out preview is the only paid path a stranger can trigger, so
      # it gets its own cap and pausing it does not touch paying customers.
      # If this ever trips, Turnstile, the rate limits or the cache are being
      # defeated — investigate rather than raise the cap. UNSIGNED.
      global_cap_usd_per_day: 10.00

    judge_fail_rate:
      # Most drafts failing the judge means something upstream is broken — a
      # bad prompt version, a degraded model — not that the writing got worse.
      # Tripping pauses all generation globally.
      rate_max: 0.60
      trailing_drafts: 50

    publish_error_rate:
      # Publishing failing at this rate means the platform, not us. Tripping
      # pauses publishing globally while leaving generation running.
      rate_max: 0.20
      window_hours: 1

  # ── Keyword & competitor discovery ────────────────────────────────────────
  # What onboarding buys from the search-data vendor, and how much of it we
  # keep. Every number here is either a purchase decision or a rule about which
  # domains a merchant is shown, so none of them belongs in the discovery code.
  discovery:
    seed_keywords:
      # How many candidate search terms the model is asked to propose from the
      # store's product families. Below the floor a store gets too few terms to
      # find a market in; above the ceiling we pay to enrich phrasings of the
      # same idea. These two are rendered into the prompt, so changing them
      # changes what is asked for, not what is filtered afterwards.
      candidates_min: 15
      candidates_max: 25
      # How many of the enriched candidates survive as the draft keyword set,
      # keeping the highest search volumes. A term dropped here is one the
      # merchant never sees and nothing is ever written about; raise it and
      # onboarding proposes long-tail terms nobody searches for.
      keep_max: 15
    competitors:
      # How deep into the results page a domain still counts as ranking. Ten is
      # the first page: below it a merchant would not recognise the domain as
      # competing with them, and the vendor charges the same for the read
      # either way.
      serp_position_max: 10
      # How many of the store's own confirmed search terms a domain has to
      # appear for before we will name it. One shared result is a coincidence;
      # this many is a pattern. Lower it and merchants are shown publishers and
      # one-off blogs as rivals; raise it and a genuine competitor who happens
      # to rank for a different slice of the market is never mentioned.
      appears_in_keywords_min: 3
      # The most competitors onboarding may propose. The hard ceiling of five
      # per account is a product invariant enforced in the API and the
      # database, not a number to tune here; this is how many of those five
      # slots we fill on the merchant's behalf before they have looked.
      auto_proposed_max: 5
      # UNSIGNED. How many of the draft keywords we buy a results page for. Each
      # one is a paid read, so this is the single biggest cost of onboarding a
      # store. Lower it and competitor detection sees a narrower slice of the
      # market; raise it and every new store costs proportionally more.
      seed_serps_max: 10
    cache:
      # How long a keyword's search volume is trusted before we buy it again.
      # Search volumes are monthly averages and do not move daily, and the
      # vendor bills per request. This is the product's memory of what a term
      # is worth; the 24-hour request cache underneath it exists only to make a
      # retry free.
      keyword_metrics_ttl_days: 30
      # How long a stored results page is reused. Rankings move within a week,
      # and a decision made on a stale results page is the one failure the
      # degradation rules refuse outright — so this is short on purpose.
      serp_snapshot_ttl_days: 7

  # ── Search Console sync ────────────────────────────────────────────────────
  # How much Search Console history we hold and how often we go back for it.
  # These decide what detection has to work with, so they belong with the other
  # numbers that shape a result rather than being buried in the sync job.
  search_console:
    # How far back the one-time import at connect reaches. Google itself serves
    # no more than 16 months, so asking for more returns nothing; asking for
    # less would leave year-on-year comparisons impossible for the first year.
    backfill_months: 16
    # The import is done in chunks of this many days, and each finished chunk is
    # committed before the next starts. Smaller means less repeated work after a
    # crash and more round trips; larger means the opposite. Changing it changes
    # only how much progress a killed import loses.
    backfill_chunk_days: 30
    # Each daily sync re-pulls this many days, not just yesterday. Google keeps
    # revising recent days for about a week after the fact, so a single-day pull
    # would freeze the first, lowest number it ever reported. Re-pulling
    # overwrites the same rows, so the cost of a larger window is bandwidth
    # rather than duplicates.
    daily_sync_lookback_days: 7
    # Search Console data arrives about two days late. Every window ends this
    # many days before today, so we never treat "not reported yet" as "nobody
    # searched".
    data_lag_days: 2

  # ── Query clusters ────────────────────────────────────────────────────────
  # A cluster is one search intent: a head query plus the near-variants of it
  # the store is actually shown for. Almost everything downstream reasons about
  # clusters rather than single queries — a page is judged on the intent it
  # serves, not on one spelling of it, and two of the store's own pages
  # splitting one intent between them is only visible once the spellings are
  # pooled. These numbers decide which searches end up inside a cluster at all,
  # and a search left out is an opportunity nobody can find.
  clusters:
    # How much recent search history the clusters are built from. Matches the
    # 28-day window every Search Console signal is judged over, so a cluster and
    # the signals read from it describe the same period.
    window_days: 28
    # UNSIGNED. A search shown fewer times than this in the window is left out
    # of clustering entirely. It is the noise floor: a query with three
    # impressions tells us nothing and a store has thousands of them. Lower it
    # and clusters fill with long-tail spellings that move no decision; raise it
    # and genuinely small markets stop producing clusters at all.
    min_query_impressions: 10
    # UNSIGNED. How many words a head query must have before other searches are
    # allowed to join it. At 1, a head like "shoes" absorbs "running shoes" and
    # "shoe polish" into one cluster and every conclusion drawn from that
    # cluster is about nothing in particular. Raise it and broad head terms stop
    # forming clusters of their own.
    head_min_tokens: 2
    # UNSIGNED. How often a *narrower* search must have been shown before it
    # gets a cluster of its own rather than folding into the broader one it
    # contains. People searching "running shoes" want something different from
    # people searching "shoes", so a substantial narrower search stays separate;
    # a rare one folds in, where its handful of impressions can add to a total
    # worth acting on. Raise it and the engine sees fewer, broader intents;
    # lower it and the long tail fragments into clusters too small to act on.
    head_min_impressions: 250
    # UNSIGNED. The most near-variants one cluster may hold. Bounds both the row
    # we store and the arithmetic over it. A variant dropped here does not count
    # toward its cluster's totals, so raising this makes cluster shares slightly
    # more complete and the rows larger.
    max_member_queries: 200
    # UNSIGNED. The most clusters one store may have, keeping the busiest.
    # Bounds the write for a large store. A cluster dropped is an intent
    # detection never looks at, so this is the ceiling on how much of a store's
    # search surface the engine can see.
    max_clusters: 500

  # ── The store's own click-through curve ───────────────────────────────────
  # How often people click a result at each Google position, measured from this
  # store's own history rather than an industry table. It exists so that
  # "ranking well but nobody clicks" can be judged against what this store
  # normally achieves at that position — device mix, brand mix and the shape of
  # the results page distort published benchmarks enough to make them
  # meaningless for any one store.
  ctr_curve:
    # UNSIGNED. How much history the fit is made from. Longer than the 28-day
    # signal window on purpose: a curve is a slow-moving property of the store
    # and a month of a small store's data is too thin to fit one from. Shorten
    # it and the curve follows seasonal noise; lengthen it and it lags a store
    # that has genuinely changed.
    window_days: 90
    # UNSIGNED. The lowest-ranked position the curve describes. Past this,
    # clicks are so rare that the store has no usable evidence and the signal
    # that reads the curve does not look this far down anyway.
    max_position: 20
    # UNSIGNED. Below this many impressions in the window the store's own data
    # is not enough to fit a curve from, and the standard curve below is used
    # instead. This is the number `ctr_curve.sample_n` is judged against. Lower
    # it and small stores get a curve fitted from thin evidence, which is worse
    # than a sensible default because it looks specific.
    min_sample_impressions: 1000
    # UNSIGNED. How many distinct positions must carry impressions before a fit
    # is attempted. A curve drawn through two points is a line through two
    # points, not a description of anything.
    min_position_buckets: 5
    # UNSIGNED. The fitted curve is clamped into this range at every position.
    # A least-squares fit over odd data can otherwise predict a click rate above
    # 1 at position 1, or effectively zero at position 3, and either would make
    # the low-click signal fire on every page or on none.
    fitted_ctr_min: 0.0005
    fitted_ctr_max: 0.60
    # UNSIGNED. The fallback used when the store has too little history of its
    # own: a plain, conservative click-rate-by-position table. It is deliberately
    # not tuned to any market — it exists so a new store is judged by something
    # rather than by nothing, and every store that has data of its own is judged
    # by that instead.
    standard_curve:
      "1": 0.2800
      "2": 0.1550
      "3": 0.1000
      "4": 0.0700
      "5": 0.0530
      "6": 0.0410
      "7": 0.0330
      "8": 0.0280
      "9": 0.0240
      "10": 0.0210
      "11": 0.0150
      "12": 0.0130
      "13": 0.0110
      "14": 0.0100
      "15": 0.0090
      "16": 0.0080
      "17": 0.0075
      "18": 0.0070
      "19": 0.0065
      "20": 0.0060

# ── Per-locale demand floors ─────────────────────────────────────────────────
#
# UNSIGNED, all of it. Per-country floors are required and no table was
# supplied. These are set roughly proportional to each search market's size, so
# that the same degree of commercial seriousness clears the bar in a small
# language as in English — a flat global floor would silently lock small-market
# stores out of the product. Keyed by language subtag; the resolver falls back
# from language to the global default.
#
# Everything not restated here inherits `defaults`.
locales:
  en:
    gates:
      demand_floor:
        monthly_search_volume_min: 100
