# What gates every merge: typecheck, unit and integration tests, lint, the
# analytics provisioning script in check mode, so drift between the definitions
# in this repo and the live project fails the build — and, last, actually
# starting the built application and asking it for a page, because every other
# step here passed for days while the product served nothing but errors.
#
# Two suites run on their own cadence rather than per-merge, because both cost
# real money or real time: `pnpm eval`, the frozen evaluation sets, gated on
# prompt or model changes; and `pnpm chaos`, nightly. The signal-detection
# fixtures are plain unit tests and run with the rest. Playwright (`pnpm e2e`)
# runs against a deployed environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sortiva
          POSTGRES_PASSWORD: sortiva
          POSTGRES_DB: sortiva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sortiva -d sortiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://sortiva:sortiva@localhost:5432/sortiva_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: .env.example completeness
        run: pnpm env:check

      - name: Enforcement rules reject planted violations
        run: pnpm lint:prove

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Contracts — zod and OpenAPI agree
        run: pnpm contracts:check

      - name: Wired-stub report
        run: pnpm stubs:report

      - name: PostHog dashboards-as-code check
        run: pnpm posthog:check

      - name: Build
        run: pnpm build

      # Every step above this line passed, every day, while the deployed product
      # answered 500 to every request — the landing page and the health check
      # included. They all read the code; none of them ever started it. This one
      # runs the built server the way the platform runs it and asks it for the
      # landing page and the health check.
      - name: The built application starts and serves a page
        run: pnpm smoke:boot

      # And the same two pages from `next dev`, because the two are not the same
      # build. Next compiles the start-up hook for the Edge runtime as well as
      # Node, and Edge has no filesystem — so a Node-only import reachable from
      # that hook breaks development while the step above stays green. That is
      # what happened: every page in `next dev` answered 500 for most of a week
      # and no gate could see it, because no gate had ever started a dev server.
      - name: The development server starts and serves a page
        run: pnpm smoke:dev

  # Runs on any change to a prompt file or a model id, and a failure blocks the
  # deploy. Gated on the paths that can change a model's behaviour.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Did a prompt or a model id change?
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -Eq '^packages/llm/(prompts/|src/models\.ts)|\.eval/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.run == 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.run == 'true'

      - name: Prompt eval suite
        if: steps.changed.outputs.run == 'true'
        run: pnpm eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
