services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sortiva
      POSTGRES_PASSWORD: sortiva
      POSTGRES_DB: sortiva
    ports:
      - "54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortiva"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - sortiva-pg:/var/lib/postgresql/data
volumes:
  sortiva-pg:
