# Pushed to Shopify by the founders (see docs/for-the-founders.md). Webhooks only arrive once this is pushed.
client_id = "0a139e87aaa0663aaff9e00435475349"
name = "Sortiva"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Products and content only: no orders, no customers (decision D3).
scopes = "read_products,read_content,write_content"

[auth]
redirect_urls = []

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete", "collections/create", "collections/update", "collections/delete", "app/uninstalled"]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks"
