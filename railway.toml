# tech §2.1 — v1 topology is two Railway services and no more: `app` (Next.js +
# Graphile Worker in the same Node process) and `postgres`. The worker split is a
# start-command change, deliberately not taken yet.
#
# The `postgres` service is provisioned from Railway's Postgres template rather
# than declared here (Railway databases are template-provisioned, not built from
# the repo); `app` reads it through DATABASE_URL.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @sortiva/web run build"
watchPatterns = ["apps/**", "packages/**", "package.json", "pnpm-lock.yaml"]

[deploy]
# Migrations run before the new deployment serves traffic (tech §5: "forward-only,
# applied on deploy before the new code serves traffic"). Without this the first
# deploy would serve code against a database with no tables.
#
# `drizzle-kit` is a devDependency. The build installs every dependency, so it is
# present at pre-deploy time — if anyone ever adds `--prod` to the install above,
# this command is what breaks, and it breaks the deploy rather than the app.
preDeployCommand = ["pnpm db:migrate"]

# NEXT_MANUAL_SIG_HANDLE=1 on the start command stops Next installing its own
# SIGTERM handler. Measured (DECISIONS 2026-09-01 R5): without it Next exits on
# the signal before our handler finishes, so in-flight jobs are killed instead of
# drained and the last analytics events are dropped on every deploy.
#
# Safe because a handler always exists on both paths: with the worker running,
# `installSignalHandlers` drains it and exits; with WORKER_ENABLED=false, the
# startup hook registers its own drain and exits. If that ever stops being true
# the process would hang until Railway kills it, so treat both paths as load
# bearing — there is a test for each.
#
# --max-old-space-size pinned per tech §2.1 so a leak OOMs loudly instead of
# silently billing a swollen resident set.
#
# `apps/web` is the application directory, and it is an argument rather than the
# service's working directory on purpose. `next start` with no directory starts
# the application in the directory it was run from, which here is the repository
# root — where there is no build, because the build output is in `apps/web`.
#
# Setting the service's working directory to `apps/web` instead would fix this
# one command and break two others: the migration that runs before the deploy is
# invoked from the root, and the thresholds config is read from a path relative
# to it. One argument moves the one thing that needs moving.
startCommand = "NEXT_MANUAL_SIG_HANDLE=1 node --max-old-space-size=384 apps/web/node_modules/next/dist/bin/next start apps/web -p $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# tech §2.1 — no scale-to-zero on `app`: the preview endpoint is the public
# funnel and the in-process worker needs its cron ticks.
numReplicas = 1
sleepApplication = false

[environments.production.deploy]
startCommand = "NEXT_MANUAL_SIG_HANDLE=1 node --max-old-space-size=384 apps/web/node_modules/next/dist/bin/next start apps/web -p $PORT"
